services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - artha_data:/data

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
      args:
        # Browser-facing URL: resolved from the host machine, not container-to-container,
        # since fetch() runs in the user's browser after the page loads.
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  artha_data:
